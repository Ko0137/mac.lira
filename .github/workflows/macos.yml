name: Build macOS installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: |
          if [[ "$(uname -m)" == "arm64" ]] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Set up ARM64 JDK 17
        id: jdk-arm
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: aarch64

      - name: Set up Intel JDK 17
        id: jdk-x64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Prepare Apple Developer ID signing
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" && -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "Both Apple certificate secrets must be configured." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/lira-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "The imported certificate is not a valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          rm -f "$certificate"

      - name: Prepare Apple notarization
        id: notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [[ -z "$APPLE_ID" && -z "$APPLE_APP_SPECIFIC_PASSWORD" && -z "$APPLE_TEAM_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "All three Apple notarization secrets must be configured." >&2
            exit 1
          fi
          if [[ "$SIGNING_ENABLED" != "true" ]]; then
            echo "Notarization requires a configured Developer ID certificate." >&2
            exit 1
          fi

          xcrun notarytool store-credentials lira-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$APPLE_SIGN_KEYCHAIN"
          echo "APPLE_NOTARY_PROFILE=lira-notary" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Apple Silicon and Intel DMGs
        working-directory: desktop
        env:
          JAVA_HOME_ARM64: ${{ steps.jdk-arm.outputs.path }}
          JAVA_HOME_X64: ${{ steps.jdk-x64.outputs.path }}
        run: bash ./build-macos.sh universal

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: LIRA-macOS-Universal
          path: desktop/build/LIRA-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 14

      - name: Report signing status
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          NOTARIZED: ${{ steps.notarization.outputs.enabled }}
        run: |
          if [[ "$SIGNED" == "true" && "$NOTARIZED" == "true" ]]; then
            echo "The Apple Silicon and Intel DMGs were signed and notarized." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SIGNED" == "true" ]]; then
            echo "The DMGs were signed, but not notarized. Configure the Apple notarization secrets for smoother first launch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The DMGs are unsigned. Configure the Apple Developer ID and notarization secrets before distribution." >> "$GITHUB_STEP_SUMMARY"
          fi
